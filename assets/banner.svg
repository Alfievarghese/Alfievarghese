<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 260" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="obsidianBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040404"/>
      <stop offset="50%" stop-color="#080808"/>
      <stop offset="100%" stop-color="#030303"/>
    </linearGradient>

    <!-- Warm Amber Glow -->
    <radialGradient id="amberGlow" cx="88%" cy="15%" r="65%">
      <stop offset="0%" stop-color="#FFB347" stop-opacity="0.14"/>
      <stop offset="50%" stop-color="#FB582D" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Fire Line Gradient -->
    <linearGradient id="fireGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#840A10"/>
      <stop offset="45%" stop-color="#FB582D"/>
      <stop offset="100%" stop-color="#FFB347"/>
    </linearGradient>

    <!-- Subtle Technical Grid -->
    <pattern id="techGrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#161616" stroke-width="0.8"/>
      <circle cx="0" cy="0" r="0.75" fill="#282828"/>
    </pattern>
  </defs>

  <style>
    .mono { font-family: ui-monospace, 'DM Mono', 'Cascadia Code', 'Source Code Pro', monospace; }
    .display { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; font-weight: 800; }
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.35; }
      50% { opacity: 1; }
    }
    .pulsing {
      animation: pulseGlow 2.4s infinite ease-in-out;
    }
    @keyframes traceMove {
      0% { transform: translateX(0); opacity: 0.1; }
      50% { opacity: 1; }
      100% { transform: translateX(780px); opacity: 0.1; }
    }
    .trace-beam {
      animation: traceMove 5s infinite linear;
    }
  </style>

  <!-- Base Shell -->
  <rect width="920" height="260" fill="url(#obsidianBg)" stroke="#1C1C1C" stroke-width="1.2"/>
  <rect width="920" height="260" fill="url(#techGrid)"/>
  <rect width="920" height="260" fill="url(#amberGlow)"/>

  <!-- Corner Brackets -->
  <path d="M 22 36 L 22 22 L 36 22" fill="none" stroke="#FFB347" stroke-width="1.8" stroke-opacity="0.8"/>
  <path d="M 898 36 L 898 22 L 884 22" fill="none" stroke="#FFB347" stroke-width="1.8" stroke-opacity="0.8"/>
  <path d="M 22 224 L 22 238 L 36 238" fill="none" stroke="#FFB347" stroke-width="1.8" stroke-opacity="0.8"/>
  <path d="M 898 224 L 898 238 L 884 238" fill="none" stroke="#FFB347" stroke-width="1.8" stroke-opacity="0.8"/>

  <!-- Top Telemetry Row -->
  <g transform="translate(48, 36)">
    <!-- Status Indicator -->
    <rect width="216" height="24" rx="2" fill="#0C0C0C" stroke="#222222" stroke-width="1"/>
    <circle cx="16" cy="12" r="3.5" fill="#FFB347" class="pulsing"/>
    <text x="28" y="16" class="mono" font-size="10.5" font-weight="600" fill="#FFB347" letter-spacing="0.1em">STATUS // OPEN TO COLLAB</text>

    <!-- Geographic Coordinates -->
    <text x="824" y="16" text-anchor="end" class="mono" font-size="11" fill="#78716C" letter-spacing="0.06em">
      9.7130° N, 76.6830° E <tspan fill="#333333">|</tspan> PALAI, KERALA, IN
    </text>
  </g>

  <!-- Hero Typography -->
  <g transform="translate(48, 116)">
    <!-- Name -->
    <text x="0" y="0" class="display" font-size="52" fill="#F0EDE8" letter-spacing="-0.035em">
      ALFIE VARGHESE
    </text>

    <!-- Subtitle / Tagline from Portfolio -->
    <text x="2" y="32" class="mono" font-size="13" font-weight="600" fill="#FB582D" letter-spacing="0.18em">
      CREATIVE CODER // REDEFINING WHAT AI CAN FEEL
    </text>
  </g>

  <!-- Accent Divider Line with Fire Gradient -->
  <g transform="translate(48, 172)">
    <line x1="0" y1="0" x2="824" y2="0" stroke="#161616" stroke-width="1"/>
    <line x1="0" y1="0" x2="180" y2="0" stroke="url(#fireGrad)" stroke-width="2"/>
    <circle cx="180" cy="0" r="2.5" fill="#FFB347"/>
  </g>

  <!-- Real Verification Chips -->
  <g transform="translate(48, 196)">
    <!-- Chip 1: Linux Kernel -->
    <rect x="0" y="0" width="205" height="26" fill="#0D0D0D" stroke="#222222" stroke-width="1"/>
    <text x="12" y="17" class="mono" font-size="10" fill="#F0EDE8" letter-spacing="0.05em">
      <tspan fill="#FFB347">🐧</tspan> LINUX KERNEL UPSTREAM
    </text>

    <!-- Chip 2: IEEE Published -->
    <rect x="217" y="0" width="200" height="26" fill="#0D0D0D" stroke="#222222" stroke-width="1"/>
    <text x="229" y="17" class="mono" font-size="10" fill="#F0EDE8" letter-spacing="0.05em">
      <tspan fill="#FB582D">📄</tspan> IEEE XPLORE RESEARCHER
    </text>

    <!-- Chip 3: Google Student Ambassador -->
    <rect x="429" y="0" width="195" height="26" fill="#0D0D0D" stroke="#222222" stroke-width="1"/>
    <text x="441" y="17" class="mono" font-size="10" fill="#F0EDE8" letter-spacing="0.05em">
      <tspan fill="#38BDF8">✦</tspan> GOOGLE AMBASSADOR
    </text>

    <!-- Chip 4: IEEE RAS Vice Chair -->
    <rect x="636" y="0" width="188" height="26" fill="#0D0D0D" stroke="#222222" stroke-width="1"/>
    <text x="648" y="17" class="mono" font-size="10" fill="#F0EDE8" letter-spacing="0.05em">
      <tspan fill="#10B981">●</tspan> VICE CHAIR, IEEE RAS
    </text>
  </g>

  <!-- Bottom Telemetry Footer -->
  <g transform="translate(48, 244)">
    <text x="0" y="0" class="mono" font-size="10" fill="#57534E" letter-spacing="0.08em">
      DOMAIN // LOW-LEVEL EMBEDDED · SENSORY TELEMETRY · EDGE COMPUTER VISION
    </text>
    <text x="824" y="0" text-anchor="end" class="mono" font-size="10" fill="#78716C" letter-spacing="0.08em">
      NODE: <tspan fill="#FFB347">@Alfievarghese</tspan> // SJCET PALAI
    </text>
  </g>
</svg>
