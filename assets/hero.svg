<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 280" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0d131f"/>
      <stop offset="100%" stop-color="#080c14"/>
    </linearGradient>

    <!-- Emerald Glow -->
    <radialGradient id="emeraldGlow" cx="85%" cy="20%" r="55%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.18"/>
      <stop offset="50%" stop-color="#10b981" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>

    <!-- Cyan Ambient Glow -->
    <radialGradient id="cyanGlow" cx="15%" cy="85%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.45"/>
      <circle cx="0" cy="0" r="1" fill="#334155" fill-opacity="0.6"/>
    </pattern>

    <!-- Subtle Dot Matrix -->
    <pattern id="dots" width="15" height="15" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.75" fill="#38bdf8" fill-opacity="0.15"/>
    </pattern>

    <!-- Text Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <style>
    .mono { font-family: ui-monospace, 'Cascadia Code', 'Source Code Pro', Menlo, Consolas, 'DejaVu Sans Mono', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
    @keyframes pulse {
      0% { opacity: 0.4; }
      50% { opacity: 1; }
      100% { opacity: 0.4; }
    }
    .pulsing-dot {
      animation: pulse 2.5s infinite ease-in-out;
    }
  </style>

  <!-- Container Box -->
  <rect width="920" height="280" rx="14" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5"/>
  <rect width="920" height="280" rx="14" fill="url(#grid)"/>
  <rect width="920" height="280" rx="14" fill="url(#emeraldGlow)"/>
  <rect width="920" height="280" rx="14" fill="url(#cyanGlow)"/>

  <!-- Corner Brackets -->
  <path d="M 24 38 L 24 24 L 38 24" fill="none" stroke="#34d399" stroke-width="2" stroke-linecap="round" stroke-opacity="0.8"/>
  <path d="M 896 38 L 896 24 L 882 24" fill="none" stroke="#34d399" stroke-width="2" stroke-linecap="round" stroke-opacity="0.8"/>
  <path d="M 24 242 L 24 256 L 38 256" fill="none" stroke="#34d399" stroke-width="2" stroke-linecap="round" stroke-opacity="0.8"/>
  <path d="M 896 242 L 896 256 L 882 256" fill="none" stroke="#34d399" stroke-width="2" stroke-linecap="round" stroke-opacity="0.8"/>

  <!-- Top Telemetry Bar -->
  <g transform="translate(48, 38)">
    <!-- Status Pill -->
    <rect width="210" height="24" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <circle cx="16" cy="12" r="4" fill="#10b981" class="pulsing-dot"/>
    <text x="28" y="16" class="mono" font-size="10.5" font-weight="600" fill="#34d399" letter-spacing="0.08em">SYS.ONLINE // ACTIVE LAB</text>

    <!-- Geographic Coordinates & Telemetry -->
    <text x="824" y="16" text-anchor="end" class="mono" font-size="11" fill="#64748b" letter-spacing="0.05em">
      LOC: 9.98°N, 76.30°E <tspan fill="#334155">|</tspan> KERALA, IN
    </text>
  </g>

  <!-- Main Hero Content -->
  <g transform="translate(48, 120)">
    <!-- Primary Name -->
    <text x="0" y="0" class="sans" font-size="46" font-weight="800" fill="url(#titleGrad)" letter-spacing="-0.035em">
      ALFIE VARGHESE
    </text>

    <!-- Subtitle / Mission Tagline -->
    <text x="2" y="32" class="mono" font-size="13.5" font-weight="600" fill="url(#accentGrad)" letter-spacing="0.14em">
      CREATIVE TECHNOLOGIST // AI SYSTEMS &amp; EMBEDDED COMPUTING
    </text>
  </g>

  <!-- Technical Capability Chips -->
  <g transform="translate(48, 186)">
    <!-- Chip 1 -->
    <rect x="0" y="0" width="138" height="26" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="12" y="17" class="mono" font-size="10.5" fill="#94a3b8" letter-spacing="0.05em">▸ COMPUTER VISION</text>

    <!-- Chip 2 -->
    <rect x="148" y="0" width="144" height="26" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="160" y="17" class="mono" font-size="10.5" fill="#94a3b8" letter-spacing="0.05em">▸ MULTI-AGENT ARCH</text>

    <!-- Chip 3 -->
    <rect x="302" y="0" width="158" height="26" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="314" y="17" class="mono" font-size="10.5" fill="#94a3b8" letter-spacing="0.05em">▸ EMBEDDED TELEMETRY</text>

    <!-- Chip 4 -->
    <rect x="470" y="0" width="130" height="26" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="482" y="17" class="mono" font-size="10.5" fill="#94a3b8" letter-spacing="0.05em">▸ EDGE AI / C++</text>
  </g>

  <!-- Bottom Divider Line with Accent Signal -->
  <line x1="48" y1="236" x2="872" y2="236" stroke="#1e293b" stroke-width="1"/>
  <line x1="48" y1="236" x2="160" y2="236" stroke="#10b981" stroke-width="1.5"/>

  <!-- Footer Telemetry -->
  <g transform="translate(48, 256)">
    <text x="0" y="0" class="mono" font-size="10.5" fill="#475569" letter-spacing="0.06em">
      FOCUS: WEARABLES · VISION INTELLIGENCE · EXPERIMENTAL SOFTWARE
    </text>
    <text x="824" y="0" text-anchor="end" class="mono" font-size="10.5" fill="#64748b" letter-spacing="0.06em">
      NODE ID: <tspan fill="#34d399">@Alfievarghese</tspan> [PROD_V2.6]
    </text>
  </g>
</svg>
